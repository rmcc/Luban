<!doctype html>
<html>
<head>
<title>Snapmaker Luban</title>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="description" content="">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="./favicon.ico">
<!-- color-inversion matrix for dark theme. hue-rotate is lossy, so we use a simple color
     matrix that leaves the RGB channels alone while inverting all the white/black/grays. This
     is still not a perfect rotation, but nowhere nearly as desaturated as hue-rotate() -->
<svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
  <defs>
    <filter id="lossless-hue-rotate" color-interpolation-filters="sRGB">
       <feColorMatrix type="matrix" values="
         -0.3333  0.6666  0.6666  0  0
          0.6666 -0.3333  0.6666  0  0
          0.6666  0.6666 -0.3333  0  0
          0       0       0       1  0
      "/>
    </filter>
  </defs>
</svg>
</head>
<body>
<div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
    <div style="background: transparent url('./resources/images/luban-other-Loading.gif') no-repeat 0 0; background-size: 100% 100%; height: 90px; width: 270px; display: block; margin: 0 auto;"></div>
</div>
</body>
</html>
